[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-hyra"
version = "0.1.0"
description = "A local, reproducible research harness inspired by Hyra."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mini-hyra = "mini_hyra.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
